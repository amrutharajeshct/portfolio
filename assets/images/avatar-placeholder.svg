<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="50%" stop-color="#162238"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle Glowing Outer Rings -->
  <circle cx="200" cy="200" r="176" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="200" cy="200" r="165" fill="#0b111e" opacity="0.8"/>

  <!-- Developer Silhouette -->
  <!-- Hair Base & Shoulders flow -->
  <path d="M145,150 C140,210 148,255 160,280 C170,260 230,260 240,280 C252,255 260,210 255,150 Z" fill="#1e293b"/>
  
  <!-- Head & Hair Shape -->
  <circle cx="200" cy="142" r="46" fill="#334155"/>
  <path d="M152,142 C152,108 172,88 200,88 C228,88 248,108 248,142 C248,154 242,165 238,172 C228,148 220,135 200,135 C180,135 172,148 162,172 C158,165 152,154 152,142 Z" fill="#475569"/>

  <!-- Glasses / Modern Tech Specs -->
  <rect x="176" y="134" width="18" height="13" rx="3" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
  <rect x="206" y="134" width="18" height="13" rx="3" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
  <line x1="194" y1="140" x2="206" y2="140" stroke="#38bdf8" stroke-width="2.2"/>

  <!-- Shoulders / Professional Blazer Silhouette -->
  <path d="M120,295 C120,238 155,212 200,212 C245,212 280,238 280,295 C280,305 275,310 260,310 L140,310 C125,310 120,305 120,295 Z" fill="#1a253c" stroke="#253552" stroke-width="2"/>
  <!-- Lapels -->
  <path d="M174,212 L200,250 L226,212 Z" fill="#0f172a"/>
  <path d="M190,250 L200,265 L210,250 Z" fill="#38bdf8" opacity="0.6"/>

  <!-- Database Cylinders Badge (Bottom Right Accent) -->
  <g transform="translate(252, 242) scale(0.92)" filter="url(#glow)">
    <rect x="-6" y="-6" width="60" height="70" rx="14" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
    <!-- Cylinder 1 -->
    <ellipse cx="24" cy="12" rx="18" ry="6.5" fill="#38bdf8"/>
    <path d="M6,12 v11 c0,3.6 8,6.5 18,6.5 s18,-2.9 18,-6.5 v-11" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <!-- Cylinder 2 -->
    <path d="M6,27 v11 c0,3.6 8,6.5 18,6.5 s18,-2.9 18,-6.5 v-11" fill="none" stroke="#818cf8" stroke-width="2"/>
    <!-- Cylinder 3 -->
    <path d="M6,42 v11 c0,3.6 8,6.5 18,6.5 s18,-2.9 18,-6.5 v-11" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <!-- Sparkle indicator -->
    <circle cx="40" cy="8" r="3" fill="#38bdf8"/>
  </g>
</svg>
