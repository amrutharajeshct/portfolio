<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Light & Dark harmony -->
    <linearGradient id="avatarBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="avatarAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring Base -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarBgGrad)" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="200" cy="200" r="176" fill="none" stroke="url(#avatarAccentGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.75"/>
  <circle cx="200" cy="200" r="165" fill="#ffffff" opacity="0.85"/>

  <!-- Developer Silhouette -->
  <!-- Hair Base / Long Hair Behind Shoulders -->
  <path d="M142,150 C138,215 146,260 158,285 C170,265 230,265 242,285 C254,260 262,215 258,150 Z" fill="#334155"/>
  
  <!-- Head & Hair Shape -->
  <circle cx="200" cy="142" r="46" fill="#475569"/>
  <path d="M152,142 C152,106 172,86 200,86 C228,86 248,106 248,142 C248,154 242,166 238,172 C228,148 220,135 200,135 C180,135 172,148 162,172 C158,166 152,154 152,142 Z" fill="#1e293b"/>

  <!-- Modern Tech Eyeglasses -->
  <rect x="175" y="133" width="19" height="14" rx="3.5" fill="none" stroke="#0284c7" stroke-width="2.4"/>
  <rect x="206" y="133" width="19" height="14" rx="3.5" fill="none" stroke="#0284c7" stroke-width="2.4"/>
  <line x1="194" y1="140" x2="206" y2="140" stroke="#0284c7" stroke-width="2.4"/>

  <!-- Professional Blazer / Shoulders -->
  <path d="M118,295 C118,236 154,212 200,212 C246,212 282,236 282,295 C282,305 275,310 260,310 L140,310 C125,310 118,305 118,295 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Lapel Accents -->
  <path d="M172,212 L200,252 L228,212 Z" fill="#0f172a"/>
  <path d="M188,252 L200,268 L212,252 Z" fill="#0284c7" opacity="0.8"/>

  <!-- Database Cylinders Badge (Bottom Right Accent) -->
  <g transform="translate(250, 240) scale(0.92)" filter="url(#softGlow)">
    <rect x="-6" y="-6" width="62" height="72" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <!-- Cylinder 1 -->
    <ellipse cx="25" cy="12" rx="19" ry="6.5" fill="#38bdf8"/>
    <path d="M6,12 v11 c0,3.6 8.5,6.5 19,6.5 s19,-2.9 19,-6.5 v-11" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <!-- Cylinder 2 -->
    <path d="M6,27 v11 c0,3.6 8.5,6.5 19,6.5 s19,-2.9 19,-6.5 v-11" fill="none" stroke="#818cf8" stroke-width="2"/>
    <!-- Cylinder 3 -->
    <path d="M6,42 v11 c0,3.6 8.5,6.5 19,6.5 s19,-2.9 19,-6.5 v-11" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <!-- Sparkle indicator -->
    <circle cx="41" cy="8" r="3" fill="#38bdf8"/>
  </g>
</svg>
